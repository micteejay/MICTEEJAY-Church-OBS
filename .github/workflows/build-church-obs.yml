name: Build Church OBS (Windows & Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 🪟
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Church OBS for Windows
        run: |
          cd obs-studio
          .github/scripts/Build-Windows.ps1 -Target x64 -Configuration Release

      - name: Package Windows Release
        run: |
          Compress-Archive -Path obs-studio/build_x64/install/* -DestinationPath Church-OBS-Windows-x64.zip

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Church-OBS-Windows-x64
          path: Church-OBS-Windows-x64.zip

  build-linux:
    name: Build Linux x86_64 🐧
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev \
            libqt6svg6-dev qt6-wayland libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libx11-dev libgl-dev libpulse-dev \
            libv4l-dev libwayland-dev libpipewire-0.3-dev libcurl4-openssl-dev

      - name: Configure CMake
        run: |
          cd obs-studio
          cmake -B build_release -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_BROWSER=OFF

      - name: Compile OBS Studio
        run: |
          cd obs-studio
          ninja -C build_release

      - name: Install & Package
        run: |
          cd obs-studio
          cmake --install build_release --prefix ../dist_ci/linux
          cd ..
          tar -czf Church-OBS-Linux-x86_64.tar.gz -C dist_ci/linux .

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Church-OBS-Linux-x86_64
          path: Church-OBS-Linux-x86_64.tar.gz

