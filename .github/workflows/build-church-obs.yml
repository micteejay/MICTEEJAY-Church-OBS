name: Build Church OBS (Windows & Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 🪟
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake for Windows
        run: |
          cd obs-studio
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF `
            -DENABLE_BROWSER=OFF `
            -DENABLE_AJA=OFF `
            -DENABLE_WEBRTC=OFF `
            -DENABLE_VST=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_NVAFX=OFF `
            -DENABLE_NVVFX=OFF `
            -DVIRTUALCAM_GUID="A3FCE0F5-3493-419F-958A-ABA1250EC20B"

      - name: Build Church OBS (RelWithDebInfo)
        run: |
          cd obs-studio
          cmake --build build_x64 --config RelWithDebInfo --parallel -- /consoleLoggerParameters:Summary /noLogo

      - name: Install & Package Windows Release
        run: |
          cd obs-studio
          cmake --install build_x64 --prefix ../dist_ci/windows --config RelWithDebInfo
          cd ..
          Copy-Item -Recurse -Force Bible-Song-Pro dist_ci/windows/Bible-Song-Pro
          Compress-Archive -Path dist_ci/windows/* -DestinationPath Church-OBS-Windows-x64.zip

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Church-OBS-Windows-x64
          path: Church-OBS-Windows-x64.zip

  build-linux:
    name: Build Linux x86_64 🐧
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libglib2.0-dev \
            libcurl4-openssl-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            libjansson-dev uthash-dev libsimde-dev zlib1g-dev uuid-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xinerama0-dev libxcb-composite0-dev libxcb-xfixes0-dev libxss-dev \
            libxkbcommon-dev libxcomposite-dev libxdamage-dev \
            libgl1-mesa-dev libgles2-mesa-dev libglvnd-dev libdrm-dev libpci-dev \
            libwayland-dev libpipewire-0.3-dev libpulse-dev libasound2-dev \
            libx264-dev libmbedtls-dev libspeexdsp-dev libudev-dev libv4l-dev libva-dev \
            libfontconfig-dev libfreetype6-dev \
            libluajit-5.1-dev python3-dev swig \
            nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev \
            qt6-base-dev libqt6svg6-dev qt6-base-private-dev qt6-wayland \
            libvpl-dev

      - name: Configure CMake for Linux
        run: |
          cd obs-studio
          cmake -B build_release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -DENABLE_BROWSER=OFF \
            -DENABLE_AJA=OFF \
            -DENABLE_WEBRTC=OFF \
            -DENABLE_NVENC=OFF \
            -DENABLE_VLC=OFF \
            -DENABLE_VST=OFF

      - name: Compile Church OBS
        run: |
          cd obs-studio
          ninja -C build_release

      - name: Install & Package Linux Release
        run: |
          cd obs-studio
          cmake --install build_release --prefix ../dist_ci/linux
          cd ..
          cp -r Bible-Song-Pro dist_ci/linux/
          tar -czf Church-OBS-Linux-x86_64.tar.gz -C dist_ci/linux .

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Church-OBS-Linux-x86_64
          path: Church-OBS-Linux-x86_64.tar.gz
