name: Build Church OBS (Windows & Linux)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 🪟
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Configure CMake for Windows
        run: |
          cd obs-studio
          cmake -B build_x64 -G "Visual Studio 17 2022" -A x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF -DENABLE_BROWSER=OFF

      - name: Build Church OBS (Release)
        run: |
          cd obs-studio
          cmake --build build_x64 --config Release --parallel

      - name: Install & Package Windows Release
        run: |
          cd obs-studio
          cmake --install build_x64 --prefix ../dist_ci/windows --config Release
          cd ..
          Compress-Archive -Path dist_ci/windows/* -DestinationPath Church-OBS-Windows-x64.zip

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Church-OBS-Windows-x64
          path: Church-OBS-Windows-x64.zip

  build-linux:
    name: Build Linux x86_64 🐧
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential qt6-base-dev \
            libqt6svg6-dev qt6-wayland libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libx11-dev libgl-dev libpulse-dev \
            libv4l-dev libwayland-dev libpipewire-0.3-dev libcurl4-openssl-dev

      - name: Configure CMake for Linux
        run: |
          cd obs-studio
          cmake -B build_release -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_BROWSER=OFF

      - name: Compile Church OBS
        run: |
          cd obs-studio
          ninja -C build_release

      - name: Install & Package Linux Release
        run: |
          cd obs-studio
          cmake --install build_release --prefix ../dist_ci/linux
          cd ..
          tar -czf Church-OBS-Linux-x86_64.tar.gz -C dist_ci/linux .

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Church-OBS-Linux-x86_64
          path: Church-OBS-Linux-x86_64.tar.gz
